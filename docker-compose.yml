# Every published port is bound to 127.0.0.1: reachable from this machine (browser, IDE, e2e tests), never
# from the network. Secrets come from .env (see .env.example); compose refuses to start without them.

x-postgres: &postgres
  image: postgres:16-alpine
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
    interval: 5s
    timeout: 5s
    retries: 10

x-postgres-env: &postgres-env
  POSTGRES_USER: skyline_user
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — copy .env.example to .env and set a value}

# Shared by every Java service. Each one's image has a healthcheck on /actuator/health/readiness (see Dockerfile).
x-service-env: &service-env
  DATABASE_USERNAME: skyline_user
  DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — copy .env.example to .env and set a value}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — copy .env.example to .env and set a value}
  SKYLINE_INTERNAL_API_KEY: ${SKYLINE_INTERNAL_API_KEY:?SKYLINE_INTERNAL_API_KEY is required — copy .env.example to .env and set a value}

x-redis-env: &redis-env
  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required — copy .env.example to .env and set a value}

services:
  # ──────────────────────────────────────────────────────────────
  # Microservices Databases
  # ──────────────────────────────────────────────────────────────
  auth-db:
    <<: *postgres
    container_name: skyline-auth-db
    environment:
      <<: *postgres-env
      POSTGRES_DB: skyline_auth
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - auth_pg_data:/var/lib/postgresql/data

  fleet-db:
    <<: *postgres
    container_name: skyline-fleet-db
    environment:
      <<: *postgres-env
      POSTGRES_DB: skyline_fleet
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - fleet_pg_data:/var/lib/postgresql/data

  route-db:
    <<: *postgres
    container_name: skyline-route-db
    environment:
      <<: *postgres-env
      POSTGRES_DB: skyline_route
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - route_pg_data:/var/lib/postgresql/data

  schedule-db:
    <<: *postgres
    container_name: skyline-schedule-db
    environment:
      <<: *postgres-env
      POSTGRES_DB: skyline_schedule
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - schedule_pg_data:/var/lib/postgresql/data

  reservation-db:
    <<: *postgres
    container_name: skyline-reservation-db
    environment:
      <<: *postgres-env
      POSTGRES_DB: skyline_reservation
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - reservation_pg_data:/var/lib/postgresql/data

  checkin-db:
    <<: *postgres
    container_name: skyline-checkin-db
    environment:
      <<: *postgres-env
      POSTGRES_DB: skyline_checkin
    ports:
      - "127.0.0.1:5438:5432"
    volumes:
      - checkin_pg_data:/var/lib/postgresql/data

  crew-db:
    <<: *postgres
    container_name: skyline-crew-db
    environment:
      <<: *postgres-env
      POSTGRES_DB: skyline_crew
    ports:
      - "127.0.0.1:5439:5432"
    volumes:
      - crew_pg_data:/var/lib/postgresql/data

  notification-db:
    <<: *postgres
    container_name: skyline-notification-db
    environment:
      <<: *postgres-env
      POSTGRES_DB: skyline_notification
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - notification_pg_data:/var/lib/postgresql/data

  # ──────────────────────────────────────────────────────────────
  # Infrastructure
  # ──────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: skyline-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required — copy .env.example to .env and set a value}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Catches every email the notification service sends: nothing leaves this machine. Inbox UI on :8025.
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: skyline-mailpit
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.9.10
    container_name: skyline-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      # PLAINTEXT: containers on the compose network (kafka:29092). HOST: clients on this machine, through the
      # loopback-only port mapping above (localhost:9092).
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,HOST://localhost:9092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'HOST://0.0.0.0:9092,PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ──────────────────────────────────────────────────────────────
  # Application Services
  # ──────────────────────────────────────────────────────────────
  auth-service:
    build:
      context: .
      args:
        MODULE: skyline-auth
        APP_PORT: 8083
    container_name: skyline-auth-service
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      <<: *service-env
      DATABASE_URL: jdbc:postgresql://auth-db:5432/skyline_auth
      SKYLINE_ADMIN_EMAIL: ${SKYLINE_ADMIN_EMAIL:-}
      SKYLINE_ADMIN_PASSWORD: ${SKYLINE_ADMIN_PASSWORD:-}
    depends_on:
      auth-db:
        condition: service_healthy

  fleet-service:
    build:
      context: .
      args:
        MODULE: skyline-fleet
        APP_PORT: 8081
    container_name: skyline-fleet-service
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      <<: [*service-env, *redis-env]
      DATABASE_URL: jdbc:postgresql://fleet-db:5432/skyline_fleet
      # Asked before an aircraft is retired (no depends_on: schedule depends on fleet, and the call is rare).
      SCHEDULE_SERVICE_URL: http://schedule-service:8080
    depends_on:
      fleet-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  route-service:
    build:
      context: .
      args:
        MODULE: skyline-route
        APP_PORT: 8082
    container_name: skyline-route-service
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      <<: [*service-env, *redis-env]
      DATABASE_URL: jdbc:postgresql://route-db:5432/skyline_route
    depends_on:
      route-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Crew and schedule call each other, so only schedule waits for crew (crew only calls schedule per request).
  crew-service:
    build:
      context: .
      args:
        MODULE: skyline-crew
        APP_PORT: 8086
    container_name: skyline-crew-service
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      <<: [*service-env, *redis-env]
      DATABASE_URL: jdbc:postgresql://crew-db:5432/skyline_crew
      SCHEDULE_SERVICE_URL: http://schedule-service:8080
    depends_on:
      crew-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  schedule-service:
    build:
      context: .
      args:
        MODULE: skyline-schedule
        APP_PORT: 8080
    container_name: skyline-schedule-service
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      <<: *service-env
      DATABASE_URL: jdbc:postgresql://schedule-db:5432/skyline_schedule
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FLEET_SERVICE_URL: http://fleet-service:8081
      ROUTE_SERVICE_URL: http://route-service:8082
      CREW_SERVICE_URL: http://crew-service:8086
      SKYLINE_CURRENCY: ${SKYLINE_CURRENCY:-EUR}
    depends_on:
      schedule-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      fleet-service:
        condition: service_healthy
      route-service:
        condition: service_healthy
      crew-service:
        condition: service_healthy

  reservation-service:
    build:
      context: .
      args:
        MODULE: skyline-reservation
        APP_PORT: 8084
    container_name: skyline-reservation-service
    ports:
      - "127.0.0.1:8084:8084"
    environment:
      # Redis holds the short-lived seat holds made during seat selection.
      <<: [*service-env, *redis-env]
      DATABASE_URL: jdbc:postgresql://reservation-db:5432/skyline_reservation
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FLEET_SERVICE_URL: http://fleet-service:8081
      SCHEDULE_SERVICE_URL: http://schedule-service:8080
      SKYLINE_CURRENCY: ${SKYLINE_CURRENCY:-EUR}
    depends_on:
      reservation-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      fleet-service:
        condition: service_healthy
      schedule-service:
        condition: service_healthy

  checkin-service:
    build:
      context: .
      args:
        MODULE: skyline-checkin
        APP_PORT: 8085
    container_name: skyline-checkin-service
    ports:
      - "127.0.0.1:8085:8085"
    environment:
      <<: *service-env
      DATABASE_URL: jdbc:postgresql://checkin-db:5432/skyline_checkin
      RESERVATION_SERVICE_URL: http://reservation-service:8084
    depends_on:
      checkin-db:
        condition: service_healthy
      reservation-service:
        condition: service_healthy

  notification-service:
    build:
      context: .
      args:
        MODULE: skyline-notification
        APP_PORT: 8087
    container_name: skyline-notification-service
    ports:
      - "127.0.0.1:8087:8087"
    environment:
      <<: *service-env
      DATABASE_URL: jdbc:postgresql://notification-db:5432/skyline_notification
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      # Links in emails open the web app.
      SKYLINE_WEB_BASE_URL: ${SKYLINE_WEB_BASE_URL:-http://localhost:5173}
    depends_on:
      notification-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      # Not a hard dependency at runtime (emails wait and are retried), but the local stack should catch them.
      mailpit:
        condition: service_healthy

  gateway-service:
    build:
      context: .
      args:
        MODULE: skyline-gateway
        APP_PORT: 8000
    container_name: skyline-gateway-service
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      <<: *redis-env
      FLEET_SERVICE_URL: http://fleet-service:8081
      ROUTE_SERVICE_URL: http://route-service:8082
      AUTH_SERVICE_URL: http://auth-service:8083
      RESERVATION_SERVICE_URL: http://reservation-service:8084
      CHECKIN_SERVICE_URL: http://checkin-service:8085
      CREW_SERVICE_URL: http://crew-service:8086
      SCHEDULE_SERVICE_URL: http://schedule-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8087
      SKYLINE_CORS_ALLOWED_ORIGINS: ${SKYLINE_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      # Per client IP on login/register/refresh and PNR lookup: tokens per second, and the burst on top.
      SKYLINE_RATE_LIMIT_REPLENISH: ${SKYLINE_RATE_LIMIT_REPLENISH:-5}
      SKYLINE_RATE_LIMIT_BURST: ${SKYLINE_RATE_LIMIT_BURST:-10}
      # Browser traffic arrives through the web container's nginx, which appends the client to X-Forwarded-For.
      SKYLINE_RATE_LIMIT_TRUSTED_PROXIES: ${SKYLINE_RATE_LIMIT_TRUSTED_PROXIES:-1}
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      fleet-service:
        condition: service_healthy
      route-service:
        condition: service_healthy
      schedule-service:
        condition: service_healthy
      reservation-service:
        condition: service_healthy
      checkin-service:
        condition: service_healthy
      crew-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy

  # ──────────────────────────────────────────────────────────────
  # Web front-end (nginx: the built SPA, /api proxied to the gateway)
  # ──────────────────────────────────────────────────────────────
  web:
    build:
      context: ./skyline-web
    container_name: skyline-web
    ports:
      - "127.0.0.1:5173:80"
    environment:
      SKYLINE_GATEWAY_URL: http://gateway-service:8000
    depends_on:
      gateway-service:
        condition: service_healthy

volumes:
  auth_pg_data:
  fleet_pg_data:
  route_pg_data:
  schedule_pg_data:
  reservation_pg_data:
  checkin_pg_data:
  crew_pg_data:
  notification_pg_data:
