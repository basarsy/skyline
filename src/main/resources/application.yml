spring:
  profiles:
    active: dev
  config:
    import: optional:file:.env[.properties]
  application:
    name: skyline
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/skyline}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
  cache:
    type: redis
    redis:
      time-to-live: 15m
  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: skyline-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.basarsy.skyline.schedule.event,com.basarsy.skyline.common.notification.event
    topic:
      flight-cancellation:
        partitions: ${KAFKA_TOPIC_FLIGHT_CANCEL_PARTITIONS:3}
        replicas: ${KAFKA_TOPIC_FLIGHT_CANCEL_REPLICAS:1}

jwt:
  secret: ${JWT_SECRET:dev-only-change-me-use-at-least-32-chars}
  access-token-expiry-ms: ${JWT_EXPIRY_MS:900000}
  refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}
