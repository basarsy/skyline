server:
  port: 8083

spring:
  application:
    name: skyline-auth
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/skyline_auth}
    username: ${DATABASE_USERNAME:skyline_user}
    password: ${DATABASE_PASSWORD:skyline_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration/auth

jwt:
  secret: ${JWT_SECRET:dev-only-change-me-use-at-least-32-chars}
  access-token-expiry-ms: ${JWT_EXPIRY_MS:900000}
  refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}
