server:
  port: 8083

spring:
  application:
    name: skyline-auth
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/skyline_auth}
    username: ${DATABASE_USERNAME:skyline_user}
    password: ${DATABASE_PASSWORD:skyline_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        # All LocalDateTime values are UTC (see README, "Dates and times").
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration/auth

skyline:
  internal:
    api-key: ${SKYLINE_INTERNAL_API_KEY}
  bootstrap:
    admin:
      email: ${SKYLINE_ADMIN_EMAIL:}
      password: ${SKYLINE_ADMIN_PASSWORD:}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry-ms: ${JWT_EXPIRY_MS:900000}
  refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}
