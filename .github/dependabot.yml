version: 2

updates:
  # The root pom is the parent of every module and holds the shared versions, so Dependabot covers them all from here.
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /skyline-web
    schedule:
      interval: weekly
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /
      - /skyline-web
    schedule:
      interval: weekly
    groups:
      docker-images:
        patterns: ["*"]

  # Postgres, Redis and Kafka images in docker-compose.yml.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      compose-images:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
