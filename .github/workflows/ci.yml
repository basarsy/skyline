name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

  # Boots the whole system with docker compose (real Dockerfile, Postgres, Redis, Kafka)
  # and drives it through the API gateway with the skyline-e2e suite.
  e2e:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 40
    env:
      SKYLINE_ADMIN_EMAIL: admin@skyline.local
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Generate throwaway secrets for this run
        run: |
          for name in JWT_SECRET SKYLINE_INTERNAL_API_KEY SKYLINE_ADMIN_PASSWORD; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Start the stack
        run: docker compose up -d --build

      - name: Run end-to-end tests
        run: ./mvnw -B -Pe2e verify -pl skyline-e2e

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail=300

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: skyline-e2e/target/failsafe-reports/
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose down -v
