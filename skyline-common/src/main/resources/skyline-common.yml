# Defaults shared by every Skyline service. Each service's application.yml pulls this in with
# spring.config.import: classpath:skyline-common.yml

management:
  endpoints:
    web:
      exposure:
        # Only health (incl. the liveness/readiness groups) and info are reachable over HTTP.
        include: health, info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, db

# Calls between services fail fast instead of holding a request thread, a DB connection and (for bookings) the
# cabin lock for OpenFeign's 60s default. A booking's seat claim is safe to time out: its release is registered
# before the call.
spring:
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: ${SKYLINE_FEIGN_CONNECT_TIMEOUT_MS:2000}
            read-timeout: ${SKYLINE_FEIGN_READ_TIMEOUT_MS:5000}

---
# Local debugging: SPRING_PROFILES_ACTIVE=dev logs every SQL statement.
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
