server:
  port: 8085

spring:
  application:
    name: skyline-checkin
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5438/skyline_checkin}
    username: ${DATABASE_USERNAME:skyline_user}
    password: ${DATABASE_PASSWORD:skyline_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration/checkin

jwt:
  secret: ${JWT_SECRET:dev-only-change-me-use-at-least-32-chars}

reservation:
  service:
    url: ${RESERVATION_SERVICE_URL:http://localhost:8084}

route:
  service:
    url: ${ROUTE_SERVICE_URL:http://localhost:8082}
