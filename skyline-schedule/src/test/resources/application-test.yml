spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  cache:
    type: none
  data:
    redis:
      repositories:
        enabled: false
  kafka:
    admin:
      auto-create: false
    # Producer serialization intentionally NOT overridden here: tests must exercise the
    # production config from application.yml.

jwt:
  secret: test-secret-key-at-least-32-characters-long
  access-token-expiry-ms: 900000
  refresh-token-expiry-ms: 604800000
