server:
  port: 8080

spring:
  application:
    name: skyline-schedule
  config:
    import: classpath:skyline-common.yml
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5436/skyline_schedule}
    username: ${DATABASE_USERNAME:skyline_user}
    password: ${DATABASE_PASSWORD:${POSTGRES_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # All LocalDateTime values are UTC (see README, "Dates and times").
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration/schedule
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        # Consumers bind to their own DTOs; don't leak producer class names into headers.
        spring.json.add.type.headers: false
        enable.idempotence: true
        # KafkaNotificationBridge retries each send on the request thread after commit; with the 60s default a
        # broker outage would stall a flight cancellation for minutes. Fail fast instead and let the bridge retry.
        max.block.ms: 5000
        delivery.timeout.ms: 9000
        request.timeout.ms: 4000

skyline:
  pricing:
    # ISO 4217 code of every price this service returns (validated at startup).
    currency: ${SKYLINE_CURRENCY:EUR}
  internal:
    api-key: ${SKYLINE_INTERNAL_API_KEY}

jwt:
  secret: ${JWT_SECRET}

fleet:
  service:
    url: ${FLEET_SERVICE_URL:http://localhost:8081}

route:
  service:
    url: ${ROUTE_SERVICE_URL:http://localhost:8082}

crew:
  service:
    url: ${CREW_SERVICE_URL:http://localhost:8086}

kafka:
  topic:
    flight-cancelled: skyline.flight.cancelled
