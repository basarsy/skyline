server:
  port: 8080

spring:
  application:
    name: skyline-schedule
  config:
    import: classpath:skyline-common.yml
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5436/skyline_schedule}
    username: ${DATABASE_USERNAME:skyline_user}
    password: ${DATABASE_PASSWORD:${POSTGRES_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # All LocalDateTime values are UTC (see README, "Dates and times").
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration/schedule
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # The only producer is the outbox publisher, which sends the JSON stored in outbox_events as is
      # (no type headers: consumers bind to their own DTOs).
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        # The publisher holds its claimed rows locked while it waits for each ack, so a broker outage should
        # fail a send in seconds (the row is retried later), not after the 60s/120s defaults.
        max.block.ms: 5000
        delivery.timeout.ms: 9000
        request.timeout.ms: 4000

skyline:
  pricing:
    # ISO 4217 code of every price this service returns (validated at startup).
    currency: ${SKYLINE_CURRENCY:EUR}
  internal:
    api-key: ${SKYLINE_INTERNAL_API_KEY}
  # Transactional outbox for Kafka events (see OutboxPublisher).
  outbox:
    scheduling-enabled: true
    publish-interval: PT1S
    batch-size: 100
    # At least delivery.timeout.ms above, so the producer gives up before the publisher stops waiting.
    send-timeout: 10s
    retry-backoff: 1s
    max-retry-backoff: 1m
    error-after-attempts: 10
    retention: 7d
    cleanup-interval: PT1H

jwt:
  secret: ${JWT_SECRET}

fleet:
  service:
    url: ${FLEET_SERVICE_URL:http://localhost:8081}

route:
  service:
    url: ${ROUTE_SERVICE_URL:http://localhost:8082}

crew:
  service:
    url: ${CREW_SERVICE_URL:http://localhost:8086}

kafka:
  topic:
    flight-cancelled: skyline.flight.cancelled
