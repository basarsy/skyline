server:
  port: 8080

spring:
  application:
    name: skyline-schedule
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5436/skyline_schedule}
    username: ${DATABASE_USERNAME:skyline_user}
    password: ${DATABASE_PASSWORD:skyline_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        # All LocalDateTime values are UTC (see README, "Dates and times").
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration/schedule
  cache:
    type: redis
    redis:
      time-to-live: 15m
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        # Consumers bind to their own DTOs; don't leak producer class names into headers.
        spring.json.add.type.headers: false
        enable.idempotence: true

skyline:
  internal:
    api-key: ${SKYLINE_INTERNAL_API_KEY}

jwt:
  secret: ${JWT_SECRET}

fleet:
  service:
    url: ${FLEET_SERVICE_URL:http://localhost:8081}

route:
  service:
    url: ${ROUTE_SERVICE_URL:http://localhost:8082}

crew:
  service:
    url: ${CREW_SERVICE_URL:http://localhost:8086}

kafka:
  topic:
    flight-cancelled: skyline.flight.cancelled
