server:
  port: 8081

spring:
  application:
    name: skyline-fleet
  config:
    import: classpath:skyline-common.yml
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5434/skyline_fleet}
    username: ${DATABASE_USERNAME:skyline_user}
    password: ${DATABASE_PASSWORD:${POSTGRES_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # All LocalDateTime values are UTC (see README, "Dates and times").
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration/fleet
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  cache:
    type: redis

skyline:
  internal:
    api-key: ${SKYLINE_INTERNAL_API_KEY}

jwt:
  secret: ${JWT_SECRET}

# Asked whether an aircraft still has flights before it is retired.
schedule:
  service:
    url: ${SCHEDULE_SERVICE_URL:http://localhost:8080}
