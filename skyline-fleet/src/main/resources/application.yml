server:
  port: 8081

spring:
  application:
    name: skyline-fleet
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5434/skyline_fleet}
    username: ${DATABASE_USERNAME:skyline_user}
    password: ${DATABASE_PASSWORD:skyline_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration/fleet
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
    redis:
      time-to-live: 15m

jwt:
  secret: ${JWT_SECRET:dev-only-change-me-use-at-least-32-chars}
