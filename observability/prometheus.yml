# Scrapes every service's /actuator/prometheus on the compose network (not through the gateway, which routes
# nothing to /actuator). Used by docker-compose.observability.yml.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: skyline
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - schedule-service:8080
          - fleet-service:8081
          - route-service:8082
          - auth-service:8083
          - reservation-service:8084
          - checkin-service:8085
          - crew-service:8086
          - notification-service:8087
