server:
  port: 8000

spring:
  application:
    name: skyline-gateway
  data:
    redis:
      # Token buckets of the RequestRateLimiter routes below.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  cloud:
    gateway:
      server:
        webflux:
          # Browser clients on another origin (e.g. the web front-end's dev server) need CORS. It is
          # handled here once, so no downstream service sets CORS headers itself.
          globalcors:
            cors-configurations:
              '[/**]':
                # Comma-separated list, e.g. "http://localhost:5173,https://skyline.example.com".
                allowed-origins: ${SKYLINE_CORS_ALLOWED_ORIGINS:http://localhost:5173}
                allowed-methods: GET, POST, PUT, PATCH, DELETE, OPTIONS
                allowed-headers: Authorization, Content-Type
                allow-credentials: false
                max-age: 3600
          default-filters:
            # The internal service key grants ROLE_SERVICE downstream. It must only ever be set by
            # services calling each other directly, never by external clients via the gateway.
            - RemoveRequestHeader=X-Skyline-Internal-Key
            # Should a downstream service ever add its own CORS headers, never send them twice.
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
          routes:
            # Anonymous endpoints that check a secret (password, refresh token, PNR) are rate limited per
            # client IP so they cannot be brute-forced. These routes must stay ahead of the broader ones below,
            # which match the same paths.
            - id: auth-rate-limited
              uri: ${AUTH_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/auth/login, /api/v1/auth/register, /api/v1/auth/refresh
              filters:
                - &rate-limiter
                  name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${SKYLINE_RATE_LIMIT_REPLENISH:5}
                    redis-rate-limiter.burstCapacity: ${SKYLINE_RATE_LIMIT_BURST:10}
            - id: reservation-pnr-rate-limited
              uri: ${RESERVATION_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/reservations/pnr/**
              filters:
                - *rate-limiter
            - id: fleet-service
              uri: ${FLEET_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/aircraft/**, /api/v1/aircraft-types/**
            - id: route-service
              uri: ${ROUTE_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/airports/**, /api/v1/routes/**
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/auth/**, /api/v1/users/**
            - id: reservation-service
              uri: ${RESERVATION_SERVICE_URL:http://localhost:8084}
              predicates:
                # A flight's seat map is built from bookings and seat holds, so reservation serves it (ahead of
                # the schedule route, like crew's /flights/*/crew), along with the seat and add-on catalogs.
                - Path=/api/v1/reservations/**, /api/v1/flights/*/seat-map, /api/v1/seat-price-rules/**, /api/v1/ancillary-products/**
            - id: checkin-service
              uri: ${CHECKIN_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/checkin/**
            - id: crew-service
              uri: ${CREW_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/v1/crew/**, /api/v1/flights/*/crew, /api/v1/flights/*/crew/**
            - id: schedule-service
              uri: ${SCHEDULE_SERVICE_URL:http://localhost:8080}
              predicates:
                - Path=/api/v1/flights/**

skyline:
  rate-limit:
    # Reverse proxies in front of the gateway whose X-Forwarded-For entry is trusted for the rate-limit key
    # (0 = use the TCP peer address). See RateLimitConfig.
    trusted-proxies: ${SKYLINE_RATE_LIMIT_TRUSTED_PROXIES:0}

management:
  endpoints:
    web:
      exposure:
        # The gateway's own health and info only; no route forwards /actuator to a downstream service.
        include: health, info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
