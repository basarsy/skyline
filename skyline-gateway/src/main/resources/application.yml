server:
  port: 8000

spring:
  application:
    name: skyline-gateway
  cloud:
    gateway:
      routes:
        - id: fleet-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/aircraft/**, /api/v1/aircraft-types/**
        - id: route-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/airports/**, /api/v1/routes/**
        - id: auth-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/auth/**
        - id: reservation-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/reservations/**
        - id: checkin-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/checkin/**
        - id: crew-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/crew/**
        - id: schedule-service
          uri: http://localhost:8080
          predicates:
            - Path=/api/v1/**
          filters:
            - PreserveHostHeader

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.http.server.reactive: DEBUG
    org.springframework.web.reactive: DEBUG
    reactor.netty: DEBUG
