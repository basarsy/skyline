# Security headers for every response. nginx drops server-level add_header directives in any location that has
# its own add_header, so nginx.conf includes this at server level and again in each such location.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
# The app loads only its own bundle and calls the API same-origin through /api. 'unsafe-inline' styles: sonner
# injects a <style> element at runtime. data: fonts and images: Vite inlines small assets (a font subset) and the
# boarding pass barcode is a data: URL. blob: covers the calendar (.ics) download.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
