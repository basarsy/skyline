# Rendered by the nginx image's envsubst step: ${SKYLINE_GATEWAY_URL} comes from the environment.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  # API: same origin for the browser, proxied to the gateway (no CORS preflight).
  location /api/ {
    proxy_pass ${SKYLINE_GATEWAY_URL};
    proxy_http_version 1.1;
    # $http_host keeps the port: with $host the gateway would see Origin and Host disagree and refuse the
    # request as an unlisted cross-origin call (browsers send Origin on same-origin POSTs too).
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Hashed build assets never change: cache for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # index.html must always be revalidated so new deployments are picked up.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
  }

  # SPA fallback: every other path is a client-side route.
  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri /index.html;
  }
}
