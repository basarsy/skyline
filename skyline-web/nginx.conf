# Rendered by the nginx image's envsubst step: ${SKYLINE_GATEWAY_URL} comes from the environment.

# Cache policy by path. Hashed build assets never change: cache for a year. Everything else (index.html, the SPA
# fallback, theme-init.js) is revalidated so new deployments are picked up. The API sets its own (empty value:
# nginx adds nothing).
map $uri $cache_control {
  ~^/api/ "";
  ~^/assets/ "public, max-age=31536000, immutable";
  default "no-cache";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # All headers are set here, at server level, and no location sets its own: nginx drops inherited add_header
  # directives in any location that has one. Keep it that way (vary headers through a map, as above).
  add_header Cache-Control $cache_control always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  # The app loads only its own bundle and calls the API same-origin through /api. 'unsafe-inline' styles: sonner
  # injects a <style> element at runtime. data: fonts and images: Vite inlines small assets (a font subset) and
  # the boarding pass barcode is a data: URL. blob: covers the calendar (.ics) download.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  # API: same origin for the browser, proxied to the gateway (no CORS preflight).
  location /api/ {
    proxy_pass ${SKYLINE_GATEWAY_URL};
    proxy_http_version 1.1;
    # $http_host keeps the port: with $host the gateway would see Origin and Host disagree and refuse the
    # request as an unlisted cross-origin call (browsers send Origin on same-origin POSTs too).
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location /assets/ {
    try_files $uri =404;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # SPA fallback: every other path is a client-side route.
  location / {
    try_files $uri /index.html;
  }
}
