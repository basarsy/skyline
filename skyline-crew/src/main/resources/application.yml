server:
  port: 8086

spring:
  application:
    name: skyline-crew
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5439/skyline_crew}
    username: ${DATABASE_USERNAME:skyline_user}
    password: ${DATABASE_PASSWORD:${POSTGRES_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # All LocalDateTime values are UTC (see README, "Dates and times").
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration/crew
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  cache:
    type: redis

skyline:
  cache:
    # Turns on skyline-common's Redis CacheConfig (@Cacheable lookups).
    enabled: true
  internal:
    api-key: ${SKYLINE_INTERNAL_API_KEY}

jwt:
  secret: ${JWT_SECRET}

schedule:
  service:
    url: ${SCHEDULE_SERVICE_URL:http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        # Only health (incl. the liveness/readiness groups) and info are reachable over HTTP.
        include: health, info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, db

---
# Local debugging: SPRING_PROFILES_ACTIVE=dev logs every SQL statement.
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
