server:
  port: 8086

spring:
  application:
    name: skyline-crew
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5439/skyline_crew}
    username: ${DATABASE_USERNAME:skyline_user}
    password: ${DATABASE_PASSWORD:skyline_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration/crew

skyline:
  internal:
    api-key: ${SKYLINE_INTERNAL_API_KEY}

jwt:
  secret: ${JWT_SECRET}

schedule:
  service:
    url: ${SCHEDULE_SERVICE_URL:http://localhost:8080}
