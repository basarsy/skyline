server:
  port: 8086

spring:
  application:
    name: skyline-crew
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5439/skyline_crew}
    username: ${DATABASE_USERNAME:skyline_user}
    password: ${DATABASE_PASSWORD:skyline_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration/crew

jwt:
  secret: ${JWT_SECRET:dev-only-change-me-use-at-least-32-chars}

schedule:
  service:
    url: ${SCHEDULE_SERVICE_URL:http://localhost:8080}
