server:
  port: 8084

spring:
  application:
    name: skyline-reservation
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5437/skyline_reservation}
    username: ${DATABASE_USERNAME:skyline_user}
    password: ${DATABASE_PASSWORD:skyline_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration/reservation

jwt:
  secret: ${JWT_SECRET:dev-only-change-me-use-at-least-32-chars}

fleet:
  service:
    url: ${FLEET_SERVICE_URL:http://localhost:8081}

schedule:
  service:
    url: ${SCHEDULE_SERVICE_URL:http://localhost:8080}

kafka:
  topic:
    flight-cancelled: skyline.flight.cancelled

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: reservation-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
