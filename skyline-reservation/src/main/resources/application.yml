server:
  port: 8084

spring:
  application:
    name: skyline-reservation
  config:
    import: classpath:skyline-common.yml
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5437/skyline_reservation}
    username: ${DATABASE_USERNAME:skyline_user}
    password: ${DATABASE_PASSWORD:${POSTGRES_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # All LocalDateTime values are UTC (see README, "Dates and times").
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration/reservation
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: reservation-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer turns malformed records into handled errors instead of
      # an endless poison-pill loop; JsonDeserializer is the delegate.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.basarsy.skyline.reservation.client.dto.FlightCancelledEvent
        spring.json.trusted.packages: com.basarsy.skyline.reservation.client.dto
    producer:
      # Settings of the outbox publisher's producer (OutboxKafkaConfig), as in the schedule service: the JSON
      # stored in outbox_events is sent as is, with no type headers.
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        delivery.timeout.ms: 9000
        request.timeout.ms: 4000

skyline:
  pricing:
    # ISO 4217 code of every price this service returns (validated at startup).
    currency: ${SKYLINE_CURRENCY:EUR}
  internal:
    api-key: ${SKYLINE_INTERNAL_API_KEY}
  seats:
    # How long a seat picked during booking or check-in stays held for that passenger.
    hold-ttl: ${SKYLINE_SEAT_HOLD_TTL:PT15M}
    # How long a fetched aircraft layout is reused before asking the fleet service again.
    layout-cache-ttl: PT5M
  # Transactional outbox for booking events (skyline-common, see OutboxPublisher).
  outbox:
    enabled: true
    publish-interval: PT1S
    batch-size: 100
    # At least delivery.timeout.ms above, so the producer gives up before the publisher stops waiting.
    send-timeout: 10s
    retry-backoff: 1s
    max-retry-backoff: 1m
    error-after-attempts: 10
    retention: 7d
    cleanup-batch-size: 1000
    cleanup-interval: PT1H

jwt:
  secret: ${JWT_SECRET}

fleet:
  service:
    url: ${FLEET_SERVICE_URL:http://localhost:8081}

schedule:
  service:
    url: ${SCHEDULE_SERVICE_URL:http://localhost:8080}

kafka:
  topic:
    flight-cancelled: skyline.flight.cancelled
