spring:
  kafka:
    admin:
      auto-create: false
    listener:
      # No broker in these tests; the cancellation listener has its own tests.
      auto-startup: false

jwt:
  secret: test-secret-key-at-least-32-characters-long
  access-token-expiry-ms: 900000
  refresh-token-expiry-ms: 604800000

skyline:
  internal:
    api-key: test-internal-api-key-at-least-32-chars
  pricing:
    currency: EUR
  seats:
    hold-ttl: PT2S
    layout-cache-ttl: PT0S
